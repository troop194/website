<nav class="site-nav">
  <div class="site-nav__inner">
    <a class="site-nav__brand" href="/">
      <img
        class="site-nav__logo"
        src="/assets/images/logo-header.png"
        alt=""
        width="42"
        height="44"
      />
      Troop 194
    </a>
    <button
      class="site-nav__toggle"
      type="button"
      aria-expanded="false"
      aria-controls="site-nav-links"
    >
      <span class="site-nav__toggle-icon" aria-hidden="true"></span>
      Menu
    </button>
    <div class="site-nav__links" id="site-nav-links">
      <a
        class="site-nav__link{% if current == 'scouts' %} site-nav__link--current{% endif %}"
        href="/scouts"
        >Scouts</a
      >
      <a
        class="site-nav__link{% if current == 'parents' %} site-nav__link--current{% endif %}"
        href="/parents"
        >Parents &amp; Guardians</a
      >
      <a
        class="site-nav__link{% if current == 'leaders' %} site-nav__link--current{% endif %}"
        href="/leaders"
        >Leaders</a
      >
      <a
        class="site-nav__link{% if current == 'camping' %} site-nav__link--current{% endif %}"
        href="/camping"
        >Weekend Camping</a
      >
      <a
        class="site-nav__link{% if current == 'summer-camp' %} site-nav__link--current{% endif %}"
        href="/summer-camp"
        >Summer Camp</a
      >
    </div>
  </div>
</nav>

<script>
  (function () {
    var nav = document.querySelector(".site-nav");
    var toggle = nav.querySelector(".site-nav__toggle");

    toggle.addEventListener("click", function () {
      var isOpen = nav.classList.toggle("site-nav--open");
      toggle.setAttribute("aria-expanded", String(isOpen));
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && nav.classList.contains("site-nav--open")) {
        nav.classList.remove("site-nav--open");
        toggle.setAttribute("aria-expanded", "false");
        toggle.focus();
      }
    });
  })();
</script>
